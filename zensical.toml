[project]
site_name = "OSINT Québec"
site_url = "https://osintquebec.profinfo.ca"
docs_dir = "wiki"
site_dir = "site"
use_directory_urls = true
repo_url = "https://github.com/jaixan/osintquebec"  

nav = [
  {"Page principale" = "index.md"},
  {"Sites gouvernementaux" = [
    {"Municipalités" = [
      {"Abitibi-Témiscamingue" = "municipalites/abitibi-temiscamingue.md"},
      {"Bas St-Laurent" = "municipalites/bas-st-laurent.md"},
      {"Capitale Nationale" = "municipalites/capitale-nationale.md"},
      {"Centre du Québec" = "municipalites/centre-du-quebec.md"},
      {"Chaudière Appalaches" = "municipalites/chaudiere-appalaches.md"},
      {"Côte Nord" = "municipalites/cote-nord.md"},
      {"Estrie" = "municipalites/estrie.md"},
      {"Gaspésie - Îles de la Madeleine" = "municipalites/gaspesie-iles-de-la-madeleine.md"},
      {"Lanaudière" = "municipalites/lanaudiere.md"},
      {"Laurentides" = "municipalites/laurentides.md"},
      {"Laval" = "municipalites/laval.md"},
      {"Mauricie" = "municipalites/mauricie.md"},
      {"Montérégie" = "municipalites/monteregie.md"},
      {"Montréal" = "municipalites/montreal.md"},
      {"Nord-du-Québec" = "municipalites/nord-du-quebec.md"},
      {"Outaouais" = "municipalites/outaouais.md"},
      {"Saguenay--Lac-Saint-Jean" = "municipalites/saguenay-lac-saint-jean.md"},
    ]},
    {"Gouvernement du Québec" = "quebec.md"},
    {"Gouvernement du Canada" = "canada.md"},
  ]},
  {"Autres ressources" = [
    {"Ressources commerciales" = "commerciaux.md"},
    {"Fichiers" = "fichiers.md"},
  ]},
  {"Hygiène du site" = [
    {"Statut des liens" = "status.md"},
    {"Liens non fonctionnels" = "liens-brises.md"},
  ]},
]

[project.theme]
name = "material"
language = "fr"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.plugins]
search = {}
